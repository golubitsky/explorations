services:
  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-data:/loki
    networks:
      - agent-network

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - agent-network

  python-app:
    container_name: python-app
    build:
      context: ./python-app
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOKI_URL=http://loki:3100
      - GIT_MCP_URL=http://git-mcp-server:8001
      - LOKI_MCP_URL=http://loki-mcp-server:8002
    volumes:
      - ./python-app:/app
      - ./logs:/app/logs # For generating sample logs
    depends_on:
      - loki
      - grafana
      - git-mcp-server
      - loki-mcp-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - agent-network
    logging:
      driver: loki
      options:
        loki-url: "http://host.docker.internal:3100/loki/api/v1/push"
        mode: non-blocking
        max-buffer-size: 4m
        loki-retries: "3"

  git-mcp-server:
    build:
      context: ./git-mcp-server
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./.git:/app/.git:ro # Mount your repo's git history
      - ./:/app/repo:ro # Mount source code for analysis
    environment:
      - MCP_SERVER_NAME=git-server
      - REPO_PATH=/app/repo
    networks:
      - agent-network

  loki-mcp-server:
    build:
      context: ./loki-mcp-server
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - MCP_SERVER_NAME=loki-server
      - LOKI_URL=http://loki:3100
    depends_on:
      - loki
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data: